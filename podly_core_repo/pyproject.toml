[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podly-core-cli"
version = "0.1.0"
description = "Standalone Podly processing CLI"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "litellm>=1.0",
  "ffmpeg-python>=0.2",
  "openai>=1.0",
  "groq>=0.9",
  "requests>=2.31"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
